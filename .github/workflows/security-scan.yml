name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Only needs to read repo

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        # Skip on new-branch pushes (before == all-zeros) to avoid BASE==HEAD error
        if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@b6389e24199ff37a98a48f90b95d775af819a95d  # main as of 2025-12-04
        with:
          path: ./
          # On push to main, compare against the commit before the push (not the branch name,
          # which resolves to the same commit as HEAD and causes BASE==HEAD error)
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
          head: HEAD
          extra_args: --json

      - name: Check for API keys in code
        run: |
          echo "Checking for hardcoded API keys..."
          if git grep -E "sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{90,}" -- '*.ts' '*.js' '*.tsx' '*.jsx' '*.json' ':!*.example' ':!.github/workflows/security-scan.yml'; then
            echo "❌ ERROR: API keys found in tracked files!"
            exit 1
          else
            echo "✅ No API keys found in code"
          fi

      - name: Verify dist/ not committed
        run: |
          echo "Checking for dist/ artifacts..."
          if git ls-files | grep -E "dist/|build/" | grep -v "dist/README.md"; then
            echo "❌ ERROR: Build artifacts found in git!"
            git ls-files | grep -E "dist/|build/"
            exit 1
          else
            echo "✅ No build artifacts committed"
          fi

  dependency-audit:
    name: Audit Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Clone frame-ui-components (file: protocol dep)
        run: git clone --depth 1 https://github.com/ojfbot/frame-ui-components.git ../frame-ui-components

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b  # v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: |
          echo "🔍 Auditing production dependencies for vulnerabilities..."
          pnpm audit --prod --audit-level=high
          echo "✅ Dependency audit passed (no high/critical vulnerabilities)"
          echo "Note: Moderate and low vulnerabilities are allowed but should be reviewed"

  clean-install-test:
    name: Verify Clean Install
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Clone frame-ui-components (file: protocol dep)
        run: git clone --depth 1 https://github.com/ojfbot/frame-ui-components.git ../frame-ui-components

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b  # v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Verify clean install from lockfile
        run: |
          echo "🔍 Testing clean install with frozen lockfile..."
          pnpm install --frozen-lockfile
          echo "✅ Clean install successful"

      - name: Verify type checking works
        run: |
          echo "🔍 Running type checks on all packages..."
          pnpm --filter @resume-builder/agent-core type-check
          pnpm --filter @resume-builder/api type-check
          pnpm --filter @resume-builder/browser-app type-check
          echo "Note: @resume-builder/agent-graph excluded due to pre-existing LangChain type warnings (non-blocking)"
          echo "✅ Type checking passed"

      - name: Verify builds work
        run: |
          echo "🔍 Building core packages..."
          pnpm --filter @resume-builder/agent-core build
          pnpm --filter @resume-builder/api build
          pnpm --filter @resume-builder/browser-app build
          pnpm --filter @resume-builder/browser-automation build
          echo "✅ Build successful"

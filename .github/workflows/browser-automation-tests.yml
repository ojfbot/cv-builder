name: Browser Automation Tests (Docker)

# ✅ Docker infrastructure complete - runs visual regression tests in containers
# Uses docker-compose.ci.yml for deterministic, isolated testing environment
#
# Job structure:
#   browser-tests  — runs tests, S3 pipeline, PR comment; read-only git permissions
#   deploy         — commits draw.io + baselines, deploys visual-dashboard to Pages
#                    (non-PR events only, Pages deployment gated on main branch)

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/browser-app/**'
      - 'packages/browser-automation/**'
      - 'packages/api/**'
      - 'packages/agent-core/**'
      - '.github/workflows/browser-automation-tests.yml'
      - 'docker-compose.ci.yml'
  push:
    branches: [main]  # Only run on main branch (after PR merge), not on PR branches
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Update visual regression baselines'
        required: false
        type: boolean
        default: false

# Prevent duplicate runs on PRs (pull_request + push events)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Deterministic CI environment
  CI: true
  NODE_ENV: test
  HEADLESS: true
  # Force color output for better logs
  FORCE_COLOR: 1

jobs:
  browser-tests:
    name: Visual Regression & UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write   # needed by: "Comment PR with results" step
      issues: write          # needed by: GitHub script in PR comment step
      id-token: write        # needed by: OIDC → AWS role assumption (no static keys)
      packages: none
      statuses: none
    # Force sequential execution to avoid Docker resource contention
    concurrency:
      group: browser-automation-tests
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history for baseline comparison
          fetch-depth: 0

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check packages
        run: pnpm type-check || echo "::warning::Type-check failed — see step logs for details"

      - name: Setup temp directories
        run: |
          mkdir -p temp/screenshots
          mkdir -p temp/test-results
          chmod -R 777 temp

      - name: Start services with Docker Compose
        run: |
          docker compose -f docker-compose.ci.yml up -d
          echo "Waiting for services to be ready..."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Wait for services
        run: |
          echo "Waiting for browser-app (http://localhost:3000)..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'

          echo "Waiting for API (http://localhost:3001/health)..."
          timeout 60 bash -c 'until curl -sf http://localhost:3001/health > /dev/null; do sleep 2; done'

          echo "Waiting for browser-automation (http://localhost:3002/health)..."
          timeout 60 bash -c 'until curl -sf http://localhost:3002/health > /dev/null; do sleep 2; done'

          echo "✅ All services are ready"

      - name: Show service logs (debug)
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml logs browser-app
          docker compose -f docker-compose.ci.yml logs api
          docker compose -f docker-compose.ci.yml logs browser-automation

      - name: Run browser automation tests
        id: tests
        run: |
          docker compose -f docker-compose.ci.yml exec -T browser-automation pnpm test:comprehensive
        env:
          API_URL: http://localhost:3002
          BROWSER_APP_URL: http://browser-app:3000
          UPDATE_BASELINES: ${{ github.event.inputs.update_baselines || 'false' }}
        continue-on-error: true

      - name: Debug page load (diagnostic)
        run: |
          echo "Running diagnostic script to check page loading..."
          docker compose -f docker-compose.ci.yml exec -T browser-automation pnpm exec tsx tests/debug/test-page-load.ts
        env:
          BROWSER_APP_URL: http://browser-app:3000
          HEADLESS: 'true'
        continue-on-error: true

      - name: Run visual regression tests
        id: visual-tests
        run: |
          docker compose -f docker-compose.ci.yml exec -T browser-automation pnpm test:visual
        env:
          API_URL: http://localhost:3002
          BROWSER_APP_URL: http://browser-app:3000
          UPDATE_BASELINES: ${{ github.event.inputs.update_baselines || 'false' }}
        continue-on-error: true

      - name: Generate test report
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome || 'skipped' }}
          VISUAL_OUTCOME: ${{ steps.visual-tests.outcome || 'skipped' }}
        run: |
          mkdir -p temp/test-results
          python3 packages/browser-automation/scripts/generate-pr-comment.py

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-${{ github.run_number }}
          path: temp/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ github.run_number }}
          path: |
            temp/test-results/visual-diffs/
            packages/browser-automation/test-baselines/**/diffs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: temp/test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Configure AWS credentials (OIDC)
        if: always() && vars.S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run screenshot pipeline (upload to S3 + update draw.io)
        if: always() && vars.S3_BUCKET != ''
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "📸 Uploading screenshots to S3 and updating draw.io canvas..."
          pnpm --filter @cv-builder/browser-automation pipeline:screenshots

      - name: Upload pipeline summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-result-${{ github.run_number }}
          path: packages/browser-automation/temp/pipeline-result.json
          retention-days: 30
          if-no-files-found: ignore

      # Upload modified draw.io canvas for the deploy job to commit
      - name: Upload draw.io canvas artifact
        if: always() && vars.S3_BUCKET != ''
        uses: actions/upload-artifact@v4
        with:
          name: drawio-canvas-${{ github.run_number }}
          path: packages/browser-automation/templates/drawio/cvBuilder.drawio.xml
          retention-days: 1
          if-no-files-found: ignore

      # Run baseline capture inside Docker (containers only available in this job).
      # Git commit is handled by the deploy job to keep contents:write scoped there.
      - name: Update baselines (if requested)
        if: |
          github.event.inputs.update_baselines == 'true' &&
          github.event_name == 'workflow_dispatch'
        run: |
          # Run inside Docker so rendering matches the test environment
          docker compose -f docker-compose.ci.yml exec -T \
            -e UPDATE_BASELINES=true \
            browser-automation pnpm test:visual || true

          # Extract baselines from container to host filesystem
          docker cp \
            cv-builder-automation-ci:/app/packages/browser-automation/test-baselines/. \
            packages/browser-automation/test-baselines/

      # Upload baselines for the deploy job to commit
      - name: Upload updated baselines artifact
        if: |
          github.event.inputs.update_baselines == 'true' &&
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: updated-baselines-${{ github.run_number }}
          path: packages/browser-automation/test-baselines/
          retention-days: 1
          if-no-files-found: warn

      - name: Generate draw.io viewer URL
        id: viewer-page
        if: always()
        continue-on-error: true
        env:
          GH_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Use S3-hosted XML (images replaced with S3 URLs → tiny file) if pipeline ran
          DRAWIO_URL=""
          PIPELINE_RESULT="packages/browser-automation/temp/pipeline-result.json"
          if [ -f "$PIPELINE_RESULT" ]; then
            DRAWIO_URL=$(python3 -c "import json; d=json.load(open('$PIPELINE_RESULT')); print(d.get('drawioS3Url') or '')" 2>/dev/null || true)
          fi
          # Fall back to raw GitHub URL (may be large if baselines not yet committed)
          if [ -z "$DRAWIO_URL" ]; then
            DRAWIO_URL="https://raw.githubusercontent.com/$GH_REPO/$GH_BRANCH/packages/browser-automation/templates/drawio/cvBuilder.drawio.xml"
          fi
          ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" "$DRAWIO_URL")
          VIEWER_URL="https://viewer.diagrams.net/?url=$ENCODED&nav=1&title=cvBuilder.drawio.xml"
          echo "viewer_url=$VIEWER_URL" >> "$GITHUB_OUTPUT"
          echo "Generated: $VIEWER_URL"

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          VIEWER_URL: ${{ steps.viewer-page.outputs.viewer_url }}
        with:
          script: |
            const fs = require('fs');

            const summaryPath = 'temp/test-results/pr-comment.md';
            let comment = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : '## Browser Automation Test Results\n\n⚠️ Test report not generated. Check workflow logs.\n';

            // Only add the Draw.io section when there is at least one link to show
            const viewerUrl = process.env.VIEWER_URL || '';
            if (viewerUrl) {
              comment += '\n\n### Draw.io Architecture Canvas\n\n';
              comment += `[Open interactive diagram →](${viewerUrl})\n`;
            }

            // Artifact links
            comment += '\n\n### Artifacts\n\n';
            comment += `- [Test Screenshots](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            comment += `- [Visual Diffs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            comment += `- [Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            comment += `\n**[View Full CI Run →](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Shutdown services
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v
          docker compose -f docker-compose.ci.yml rm -f

      - name: Check test results
        if: always()
        run: |
          # Visual regression is informational until baselines are fully established
          if [ "${{ steps.visual-tests.outcome }}" != "success" ]; then
            echo "⚠️  Visual regression tests did not pass (non-blocking pre-release)"
          fi
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "❌ Comprehensive tests failed"
            exit 1
          fi
          echo "✅ All tests passed"

  # Deploy job: commits draw.io canvas + baselines, deploys visual-dashboard to Pages.
  # Runs on all non-PR events (push + workflow_dispatch) even if browser-tests failed,
  # so the draw.io canvas commit is not blocked by flaky tests.
  # Pages deployment is gated on main branch only (push or workflow_dispatch).
  deploy:
    name: Deploy (non-PR events)
    needs: [browser-tests]
    if: github.event_name != 'pull_request' && (needs.browser-tests.result == 'success' || needs.browser-tests.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # for git commit (draw.io canvas, baselines)
      pages: write      # for GitHub Pages deployment
      id-token: write   # for OIDC (Pages)
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    concurrency:
      group: deploy-pages
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download the draw.io canvas that was modified by the S3 pipeline
      - name: Download draw.io canvas artifact
        if: vars.S3_BUCKET != ''
        uses: actions/download-artifact@v4
        with:
          name: drawio-canvas-${{ github.run_number }}
          path: packages/browser-automation/templates/drawio/
        continue-on-error: true

      - name: Commit updated draw.io canvas
        if: vars.S3_BUCKET != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/browser-automation/templates/drawio/cvBuilder.drawio.xml
          git diff --cached --quiet && echo "No draw.io changes to commit" || \
            git commit -m "chore(ci): update draw.io canvas with run #${{ github.run_number }} screenshots [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} && git push \
            || echo "::warning::git rebase/push failed — possible concurrent run collision. The draw.io canvas update will be retried on the next run."

      # Download baselines that were captured inside Docker in browser-tests
      - name: Download updated baselines artifact
        if: |
          github.event.inputs.update_baselines == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          needs.browser-tests.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: updated-baselines-${{ github.run_number }}
          path: packages/browser-automation/test-baselines/
        continue-on-error: true

      - name: Commit updated baselines
        if: |
          github.event.inputs.update_baselines == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          needs.browser-tests.result == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/browser-automation/test-baselines/
          git diff --cached --quiet && echo "No baseline changes" || \
            git commit -m "chore: update visual regression baselines [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} && git push \
            || echo "::warning::git rebase/push failed — possible concurrent run collision. Re-trigger with update_baselines=true to retry."

      # Build and deploy the visual-dashboard React app to GitHub Pages.
      # Only runs on the main branch (push or workflow_dispatch on main).
      # Set VITE_S3_BASE_URL as a repository variable to enable canvas thumbnails.
      - name: Enable Corepack
        if: github.ref == 'refs/heads/main'
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Setup Node.js
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: github.ref == 'refs/heads/main'
        run: pnpm install --frozen-lockfile

      - name: Build visual dashboard
        if: github.ref == 'refs/heads/main'
        env:
          # Set VITE_S3_BASE_URL as a repository variable to enable canvas thumbnails.
          # e.g. https://ojfbot-cv-builder-<ACCOUNT_ID>-us-east-1.s3.us-east-1.amazonaws.com
          VITE_S3_BASE_URL: ${{ vars.VITE_S3_BASE_URL }}
        run: pnpm --filter @cv-builder/visual-dashboard build

      - name: Upload visual dashboard to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/visual-dashboard/dist/

      - name: Deploy visual dashboard to GitHub Pages
        id: deploy-pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

  # Optional: Matrix testing across different viewports
  # TODO: Re-enable after debugging why React app doesn't render in matrix job
  # Main visual regression tests pass, but matrix jobs timeout waiting for .app-container
  visual-regression-matrix:
    name: Visual Regression (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: false  # Temporarily disabled - see issue #65

    strategy:
      matrix:
        # Start with desktop only - mobile and tablet to be added later
        viewport: [desktop]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start services
        run: docker compose -f docker-compose.ci.yml up -d
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Wait for services
        run: |
          echo "Waiting for browser-app (http://localhost:3000)..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'

          echo "Waiting for API (http://localhost:3001/health)..."
          timeout 60 bash -c 'until curl -sf http://localhost:3001/health > /dev/null; do sleep 2; done'

          echo "Waiting for browser-automation (http://localhost:3002/health)..."
          timeout 60 bash -c 'until curl -sf http://localhost:3002/health > /dev/null; do sleep 2; done'

          echo "✅ All services are ready"

      - name: Run visual tests for ${{ matrix.viewport }}
        id: visual-tests
        run: |
          docker compose -f docker-compose.ci.yml exec -T browser-automation pnpm test:visual -- --viewport ${{ matrix.viewport }}
        env:
          API_URL: http://localhost:3002
          BROWSER_APP_URL: http://browser-app:3000
          VIEWPORT: ${{ matrix.viewport }}

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Browser App Logs ==="
          docker compose -f docker-compose.ci.yml logs --tail=50 browser-app
          echo ""
          echo "=== API Logs ==="
          docker compose -f docker-compose.ci.yml logs --tail=50 api
          echo ""
          echo "=== Browser Automation Logs ==="
          docker compose -f docker-compose.ci.yml logs --tail=50 browser-automation

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.viewport }}-${{ github.run_number }}
          path: temp/test-results/
          retention-days: 7

      - name: Shutdown
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
